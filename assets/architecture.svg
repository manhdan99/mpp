<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" width="100%" height="100%">
  <defs>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="flow-arrow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <rect width="960" height="220" rx="12" fill="#0b0f19" stroke="#1e293b" stroke-width="2"/>

  <!-- Step 1: Input .m++ -->
  <g transform="translate(30, 40)">
    <rect width="130" height="130" rx="12" fill="url(#card-grad)" stroke="#38bdf8" stroke-width="2"/>
    <text x="65" y="45" font-family="-apple-system, sans-serif" font-size="28" text-anchor="middle">📄</text>
    <text x="65" y="75" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#f8fafc" text-anchor="middle">Source File</text>
    <text x="65" y="98" font-family="-apple-system, sans-serif" font-size="16" font-weight="800" fill="#38bdf8" text-anchor="middle">*.m++</text>
    <text x="65" y="120" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Cú pháp troll</text>
  </g>

  <!-- Arrow 1 -->
  <g transform="translate(170, 95)" fill="none" stroke="url(#flow-arrow)" stroke-width="3">
    <path d="M 0 10 L 25 10 M 18 3 L 25 10 L 18 17"/>
  </g>

  <!-- Step 2: Tokenizer -->
  <g transform="translate(205, 40)">
    <rect width="135" height="130" rx="12" fill="url(#card-grad)" stroke="#10b981" stroke-width="2"/>
    <text x="67" y="45" font-family="-apple-system, sans-serif" font-size="28" text-anchor="middle">🔍</text>
    <text x="67" y="75" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#f8fafc" text-anchor="middle">Tokenizer</text>
    <text x="67" y="96" font-family="-apple-system, sans-serif" font-size="12" fill="#34d399" text-anchor="middle">Lexer chuẩn AST</text>
    <text x="67" y="118" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Bảo vệ String/Note</text>
  </g>

  <!-- Arrow 2 -->
  <g transform="translate(350, 95)" fill="none" stroke="url(#flow-arrow)" stroke-width="3">
    <path d="M 0 10 L 25 10 M 18 3 L 25 10 L 18 17"/>
  </g>

  <!-- Step 3: Transpiler Core -->
  <g transform="translate(385, 40)">
    <rect width="150" height="130" rx="12" fill="url(#card-grad)" stroke="#818cf8" stroke-width="2"/>
    <text x="75" y="45" font-family="-apple-system, sans-serif" font-size="28" text-anchor="middle">⚙️</text>
    <text x="75" y="75" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#f8fafc" text-anchor="middle">Transpiler Core</text>
    <text x="75" y="96" font-family="-apple-system, sans-serif" font-size="12" fill="#a5b4fc" text-anchor="middle">tu_dien.json</text>
    <text x="75" y="118" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Easter eggs &amp; nhe;</text>
  </g>

  <!-- Arrow 3 -->
  <g transform="translate(545, 95)" fill="none" stroke="url(#flow-arrow)" stroke-width="3">
    <path d="M 0 10 L 25 10 M 18 3 L 25 10 L 18 17"/>
  </g>

  <!-- Step 4: Output C++ -->
  <g transform="translate(580, 40)">
    <rect width="130" height="130" rx="12" fill="url(#card-grad)" stroke="#f59e0b" stroke-width="2"/>
    <text x="65" y="45" font-family="-apple-system, sans-serif" font-size="28" text-anchor="middle">⚡</text>
    <text x="65" y="75" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#f8fafc" text-anchor="middle">Valid C++</text>
    <text x="65" y="98" font-family="-apple-system, sans-serif" font-size="16" font-weight="800" fill="#fbbf24" text-anchor="middle">*.cpp</text>
    <text x="65" y="120" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Chuẩn C++17</text>
  </g>

  <!-- Arrow 4 -->
  <g transform="translate(720, 95)" fill="none" stroke="url(#flow-arrow)" stroke-width="3">
    <path d="M 0 10 L 25 10 M 18 3 L 25 10 L 18 17"/>
  </g>

  <!-- Step 5: g++ & Execution -->
  <g transform="translate(755, 40)">
    <rect width="165" height="130" rx="12" fill="url(#card-grad)" stroke="#ec4899" stroke-width="2"/>
    <text x="82" y="45" font-family="-apple-system, sans-serif" font-size="28" text-anchor="middle">🚀</text>
    <text x="82" y="75" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#f8fafc" text-anchor="middle">g++ &amp; Run</text>
    <text x="82" y="96" font-family="-apple-system, sans-serif" font-size="12" fill="#f472b6" text-anchor="middle">Native Binary</text>
    <text x="82" y="118" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Tốc độ bàn thờ + Meme</text>
  </g>
</svg>
