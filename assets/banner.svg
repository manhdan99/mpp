<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="960" height="300" rx="16" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Tech Grid Background -->
  <g stroke="#38bdf8" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="60" x2="960" y2="60" />
    <line x1="0" y1="120" x2="960" y2="120" />
    <line x1="0" y1="180" x2="960" y2="180" />
    <line x1="0" y1="240" x2="960" y2="240" />
    <line x1="160" y1="0" x2="160" y2="300" />
    <line x1="320" y1="0" x2="320" y2="300" />
    <line x1="480" y1="0" x2="480" y2="300" />
    <line x1="640" y1="0" x2="640" y2="300" />
    <line x1="800" y1="0" x2="800" y2="300" />
  </g>

  <!-- M++ Monogram Logo -->
  <g transform="translate(60, 65)">
    <rect width="110" height="110" rx="22" fill="#0f172a" stroke="url(#primary-grad)" stroke-width="2.5" filter="url(#glow)"/>
    <text x="55" y="73" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="900" fill="url(#primary-grad)" text-anchor="middle">M++</text>
  </g>

  <!-- Title & Subtitle -->
  <g transform="translate(200, 105)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      M++ <tspan fill="url(#primary-grad)">PROGRAMMING LANGUAGE</tspan>
    </text>
    <text y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="500" fill="#94a3b8">
      High-Performance Vietnamese C++ Transpiler • Native Compilation • C++17 Standard
    </text>
  </g>

  <!-- Feature Badges -->
  <g transform="translate(200, 195)">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="165" height="38" rx="19" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.5"/>
    <circle cx="20" cy="19" r="5" fill="#0ea5e9"/>
    <text x="36" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#f8fafc">C++17 Core Engine</text>

    <!-- Badge 2 -->
    <rect x="180" y="0" width="180" height="38" rx="19" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="200" cy="19" r="5" fill="#10b981"/>
    <text x="216" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#f8fafc">AST Lexer Tokenizer</text>

    <!-- Badge 3 -->
    <rect x="375" y="0" width="170" height="38" rx="19" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.5"/>
    <circle cx="395" cy="19" r="5" fill="#8b5cf6"/>
    <text x="411" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#f8fafc">Native Performance</text>

    <!-- Badge 4 -->
    <rect x="560" y="0" width="155" height="38" rx="19" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
    <circle cx="580" cy="19" r="5" fill="#f59e0b"/>
    <text x="596" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#f8fafc">Zero Overhead</text>
  </g>

  <!-- Bottom Accent Bar -->
  <rect x="0" y="294" width="960" height="6" rx="3" fill="url(#primary-grad)" />
</svg>
