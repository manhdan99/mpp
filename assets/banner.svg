<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="960" height="300" rx="16" fill="url(#bg-grad)" stroke="#334155" stroke-width="2"/>

  <!-- Subtle Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="50" x2="960" y2="50" />
    <line x1="0" y1="100" x2="960" y2="100" />
    <line x1="0" y1="150" x2="960" y2="150" />
    <line x1="0" y1="200" x2="960" y2="200" />
    <line x1="0" y1="250" x2="960" y2="250" />
    <line x1="160" y1="0" x2="160" y2="300" />
    <line x1="320" y1="0" x2="320" y2="300" />
    <line x1="480" y1="0" x2="480" y2="300" />
    <line x1="640" y1="0" x2="640" y2="300" />
    <line x1="800" y1="0" x2="800" y2="300" />
  </g>

  <!-- Glowing Logo Icon Badge -->
  <g transform="translate(60, 65)">
    <rect width="110" height="110" rx="24" fill="#1e293b" stroke="url(#accent-grad)" stroke-width="3" filter="url(#glow)"/>
    <text x="55" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="url(#accent-grad)" text-anchor="middle">M++</text>
  </g>

  <!-- Title & Subtitle -->
  <g transform="translate(200, 105)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="-1">
      M++ <tspan fill="url(#accent-grad)">PROGRAMMING LANGUAGE</tspan>
    </text>
    <text y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#94a3b8">
      Cú pháp tấu hài dân gian • Sức mạnh C++17 nguyên bản • 100% Chạy thật
    </text>
  </g>

  <!-- Feature Badges -->
  <g transform="translate(200, 195)">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="160" height="38" rx="19" fill="#1e293b" stroke="#0ea5e9" stroke-width="1.5"/>
    <circle cx="20" cy="19" r="6" fill="#0ea5e9"/>
    <text x="36" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#f8fafc">C++17 Engine</text>

    <!-- Badge 2 -->
    <rect x="175" y="0" width="180" height="38" rx="19" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="195" cy="19" r="6" fill="#10b981"/>
    <text x="211" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#f8fafc">AST Lexer Tokenizer</text>

    <!-- Badge 3 -->
    <rect x="370" y="0" width="165" height="38" rx="19" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <circle cx="390" cy="19" r="6" fill="#f59e0b"/>
    <text x="406" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Troll Warnings</text>

    <!-- Badge 4 -->
    <rect x="550" y="0" width="155" height="38" rx="19" fill="#1e293b" stroke="#ec4899" stroke-width="1.5"/>
    <circle cx="570" cy="19" r="6" fill="#ec4899"/>
    <text x="586" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Zero AI Traces</text>
  </g>

  <!-- Bottom Accent Bar -->
  <rect x="0" y="294" width="960" height="6" rx="3" fill="url(#accent-grad)" />
</svg>
